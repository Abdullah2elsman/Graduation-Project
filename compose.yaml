# Smart Book V2 — development Docker Compose stack.
#
# Services: backend (Laravel), frontend (Angular), db (MySQL 8), ai (Flask), mailpit.
# Locked V2 host ports: Angular 4200, Laravel 8080, Flask 5001, MySQL 3307, Mailpit UI 8025.
# Legacy host ports 5501/8005 stay free: no V2 service uses them.
#
# Onboarding:  cp .env.example .env && docker compose up --build

name: ${COMPOSE_PROJECT_NAME:-smart-book-v2}

services:
  db:
    image: mysql:8.0
    container_name: smart-book-v2-db
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_book_v2}
      MYSQL_USER: ${MYSQL_USER:-smartbook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartbook_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartbook_root_dev_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - smart_book_v2_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      # Environment accommodation (NOT a Smart Book architectural requirement):
      # apt needs external mirror access during the image build. On hosts whose
      # Docker embedded DNS cannot reach external resolvers, building over the
      # host network is required. Healthy hosts may remove `network: host`.
      network: host
    container_name: smart-book-v2-backend
    restart: unless-stopped
    init: true
    # Environment accommodation: external DNS override for runtime
    # `composer install` when the daemon's embedded DNS cannot resolve
    # internet names (e.g. WARP/systemd-resolved upstreams on 127.x).
    # Docker's embedded DNS still serves internal service names; the override
    # is configurable per developer via DOCKER_DNS in .env.
    dns:
      - ${DOCKER_DNS:-1.1.1.1}
    environment:
      APP_NAME: "Smart Book V2"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${BACKEND_APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-smart_book_v2}
      DB_USERNAME: ${MYSQL_USER:-smartbook}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartbook_dev_password}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: "smartbook@localhost"
      MAIL_FROM_NAME: "Smart Book V2"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/var/www/html
      - smart_book_v2_backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: smart-book-v2-frontend
    restart: unless-stopped
    init: true
    # Environment accommodation: same DOCKER_DNS override as the backend, for
    # the runtime `npm install` step. Internal service-name DNS is unaffected.
    dns:
      - ${DOCKER_DNS:-1.1.1.1}
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - smart_book_v2_frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  ai:
    build:
      context: ./ai
      # Environment accommodation (NOT a Smart Book architectural requirement):
      # pip needs PyPI access during the image build. On hosts whose Docker
      # embedded DNS cannot reach external resolvers, building over the host
      # network is required (unchanged runtime topology).
      network: host
    container_name: smart-book-v2-ai
    restart: unless-stopped
    init: true
    environment:
      FLASK_PORT: "5001"
    ports:
      - "${AI_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health', timeout=3).getcode()==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: smart-book-v2-mailpit
    restart: unless-stopped
    init: true
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    # SMTP (1025) stays internal: Laravel talks to "mailpit:1025" by service name.

volumes:
  smart_book_v2_db_data:
    name: smart_book_v2_db_data
  smart_book_v2_backend_vendor:
    name: smart_book_v2_backend_vendor
  smart_book_v2_frontend_node_modules:
    name: smart_book_v2_frontend_node_modules